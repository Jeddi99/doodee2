{% extends "admin/change_list.html" %}
{% block content %}
  <style>
    .plan-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(8rem,1fr)); gap:1rem; margin:0 0 1.25rem; }
    .plan-summary a { background:var(--darkened-bg); border:1px solid var(--hairline-color); border-radius:4px; color:var(--body-fg); padding:1rem; text-decoration:none; }
    .plan-summary strong { display:block; font-size:1.6rem; }
  </style>
  <nav class="plan-summary" aria-label="User plan summary">
    <a href="?account=users"><span>Total</span><strong>{{ plan_counts.total }}</strong></a>
    <a href="?account=users&amp;plan=free"><span>Free</span><strong>{{ plan_counts.free }}</strong></a>
    <a href="?account=users&amp;plan=vip"><span>VIP</span><strong>{{ plan_counts.vip }}</strong></a>
    <a href="?account=users&amp;plan=member"><span>Member</span><strong>{{ plan_counts.member }}</strong></a>
    <a href="?account=users&amp;plan=clinic"><span>Clinic</span><strong>{{ plan_counts.clinic }}</strong></a>
  </nav>
  {{ block.super }}
{% endblock %}
