services:
  postgres:
    image: postgres:16-alpine
    # Stated rather than inherited. gthread means the api container can hold one connection per
    # thread (CONN_MAX_AGE keeps them open), so the ceiling here is now coupled to
    # --workers x --threads. 100 leaves room for 24 api + 2 worker + beat + a psql session.
    command: postgres -c max_connections=100
    environment:
      POSTGRES_DB: doodee
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - doodee_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doodee"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/doodee
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      # create_host_path: false — ถ้าไฟล์คีย์ไม่มีจริง ให้ compose ฟ้อง error ไปเลย
      # ไม่งั้น Docker จะสร้าง "โฟลเดอร์ว่าง" ชื่อนี้ให้เงียบๆ แล้ว firebase_admin
      # จะอ่าน credential ไม่ได้ โผล่มาเป็น "Invalid Firebase token" ที่หน้าเว็บแทน
      - type: bind
        source: ./firebase-service-account.json
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
      - ./backend:/app/backend
    # host:container — gunicorn binds :8000 inside, and .env/api.js point
    # clients at localhost:8001, so the host side must be 8001.
    ports: ["8001:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # --reload because ./backend is bind-mounted: without it the process keeps the code it booted
    # with, and an edit on disk silently does nothing until someone remembers to restart.
    #
    # gthread here as well as in the Dockerfile, even though dev never needs 24 slots: a
    # threading bug that only appears under gthread must show up on a laptop, not in production.
    # compose.prod.yaml drops --reload and the bind mount.
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 -k gthread --workers 2 --threads 8 --timeout 120 --reload"
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/doodee
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # --queues is not optional. settings.CELERY_TASK_ROUTES sends process_scan, process_simulation
    # and process_skin_vision to `cv`, and reconcile_heavy_jobs to `maintenance`; without this flag
    # Celery consumes only its default `celery` queue and every scan sits at status=queued for
    # ever, with no error anywhere — the upload succeeds, the worker logs "ready", and the
    # analysis page simply stays empty. compose.prod.yaml already splits these across two workers,
    # which is why production was unaffected and this stayed hidden.
    command: celery -A config worker --loglevel=info --concurrency=2 --queues=cv,maintenance,celery
  # ตัวตั้งเวลา — ตอนนี้มีงานเดียวคือแจ้งเตือนต่ออายุสมาชิกทุกเช้า
  # แยกจาก worker เพราะถ้ารันสองตัวขึ้นไป beat จะยิงงานซ้ำ ส่วน worker ขยายกี่ตัวก็ได้
  # ถ้า beat ล่ม จะเสียแค่ “การแจ้งเตือน” ไม่กระทบสิทธิ์ของผู้ใช้ เพราะ sync_entitlement
  # ตัดสิทธิ์ตอนผู้ใช้เปิดแอปอยู่แล้ว ไม่ได้พึ่ง cron
  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/doodee
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: celery -A config beat --loglevel=info

volumes:
  doodee_postgres:
