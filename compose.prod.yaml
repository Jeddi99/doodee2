# Production overlay. Always used together with compose.yaml, never on its own:
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# compose.yaml is a development file — it bind-mounts ./backend, runs gunicorn with --reload,
# publishes Postgres-adjacent ports and hardcodes postgres/postgres. Everything here exists to
# undo one of those, so that the thing that ships is not the thing that was convenient to type.
services:
  postgres:
    # Production uses Supabase Postgres. This service remains available only for an explicit
    # local recovery profile; it is not started by the production stack.
    profiles: [local-postgres]
    command: postgres -c max_connections=100
    restart: unless-stopped

  redis:
    # Redis is the Celery broker on db 0, not only the cache. Under the default eviction policy a
    # memory ceiling silently drops keys, and a dropped key here is a queued scan that no worker
    # will ever run and no user will ever be told about. noeviction fails the enqueue loudly
    # instead — views.py already turns that into a 503 rather than a lost job.
    command: >-
      redis-server --maxmemory 256mb --maxmemory-policy noeviction
      --save 60 1000 --appendonly yes --appendfsync everysec
    volumes:
      - doodee_redis:/data
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Migrations run once, in their own container, before the api starts — not as a prefix on the
  # api command. compose.yaml can get away with `migrate && gunicorn` because dev runs one
  # container; here every api restart would re-run migrate, and two restarting at once would race.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?set the Supabase direct MIGRATION_DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis-cache:6379/0
    volumes: !override []
    depends_on: !override
      redis: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
    command: python manage.py migrate --noinput
    restart: "no"

  api:
    # null so the image's own CMD wins: gthread, 3 workers x 8 threads, no --reload. compose.yaml
    # sets a development command; this hands the decision back to the Dockerfile.
    command: null
    depends_on: !override
      redis: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    # !override, not a plain list: compose *merges* volumes and ports across files rather than
    # replacing them, so without the tag compose.yaml's ./backend bind mount and its
    # 0.0.0.0:8001 publish both survive into production. `docker compose config` shows it.
    volumes: !override
      # Only the Firebase key. The ./backend bind mount is dev-only — in production the code must
      # be the code that was built and collectstatic'd into the image, not whatever is on the host.
      - type: bind
        source: ./firebase-service-account.json
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the Supabase pooler DATABASE_URL in .env}
      REDIS_CACHE_URL: redis://redis-cache:6379/0
    # Bound to loopback: a reverse proxy terminates TLS and forwards here. Published on 0.0.0.0
    # this would be a plaintext Django open to the internet.
    ports: !override ["127.0.0.1:8001:8000"]
    # `restart: unless-stopped` only acts on a process that exits. A gunicorn whose threads are
    # all parked on a dead socket does not exit — it stays "Up 3 days" while Caddy answers 502 to
    # everyone — and this is what tells the two apart. Be clear about what it does not do: Docker
    # (unlike Swarm or Kubernetes) never restarts a container for being unhealthy, so this heals
    # nothing by itself. It turns "Up 3 days" into "Up 3 days (unhealthy)" in `docker compose ps`,
    # which is the difference between an operator seeing a 502 and guessing at Caddy, DNS and TLS
    # in turn, and reading the answer off the first command in the runbook.
    #
    # Two details that would otherwise make this probe fail against a healthy process:
    #
    # The port is 8000, not the 8001 published above. A healthcheck runs *inside* the container,
    # where gunicorn binds 0.0.0.0:8000 (backend/Dockerfile's CMD, and the two explicit commands
    # further down); 8001/8002/8003 are host-side publish mappings that do not exist in here.
    #
    # The Host header is taken from DJANGO_ALLOWED_HOSTS because Django's CommonMiddleware calls
    # `request.get_host()` on every request, /healthz included. A probe that sent the default
    # `Host: 127.0.0.1` to a production container whose ALLOWED_HOSTS is `api.doodee.app` would
    # be answered 400 DisallowedHost, and the container would report unhealthy for ever while
    # serving real traffic without a fault. Reading it from the environment rather than hardcoding
    # the domain keeps this correct on the day the domain changes.
    #
    # Slower than the redis checks above on purpose: each run starts a Python interpreter, and on
    # the 2GB VPS this is sized for (docs/DEPLOY.md) doing that every 5 seconds in three
    # containers is real memory and real CPU spent to learn nothing new. start_period covers the
    # Django + mediapipe import, which takes tens of seconds and would otherwise show as a string
    # of failures at every boot.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as request; host = os.getenv('DJANGO_ALLOWED_HOSTS', 'localhost').split(',')[0]; request.urlopen(request.Request('http://127.0.0.1:8000/healthz', headers={'Host': host}), timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker:
    volumes: !override []
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the Supabase pooler DATABASE_URL in .env}
      REDIS_CACHE_URL: redis://redis-cache:6379/0
    depends_on: !override
      redis: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
    # --max-tasks-per-child because mediapipe and opencv are not leak-free over thousands of
    # frames, and a prefork child is cheap to replace. --prefetch-multiplier 1 because these
    # tasks run for seconds: prefetching parks work on a busy child while another sits idle.
    # check_production_config first: a worker with no DATABASE_URL reports `ready` and then fails
    # every task, because Celery swallows exceptions raised from its own worker_init signal. The
    # api needs no such prefix — config/wsgi.py refuses at import and gunicorn cannot boot.
    command: >-
      sh -c "python manage.py check_production_config &&
      exec celery -A config worker --loglevel=info --queues=cv --concurrency=2
      --max-tasks-per-child=50 --prefetch-multiplier=1"
    restart: unless-stopped

  maintenance-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the Supabase pooler DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis-cache:6379/0
    depends_on:
      redis: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
    command: >-
      sh -c "python manage.py check_production_config &&
      exec celery -A config worker --loglevel=info --queues=maintenance,celery
      --concurrency=1 --prefetch-multiplier=1"
    restart: unless-stopped

  beat:
    volumes: !override []
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the Supabase pooler DATABASE_URL in .env}
      REDIS_CACHE_URL: redis://redis-cache:6379/0
    depends_on: !override
      redis: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
    command: >-
      sh -c "python manage.py check_production_config &&
      exec celery -A config beat --loglevel=info"
    # Never scale this service. Two beat processes fire every scheduled job twice, and nothing
    # here can prevent that — `docker compose up --scale beat=2` would do it. One container is
    # the default; the rule is for whoever operates it, not something compose enforces.
    restart: unless-stopped

  # Route /api/v1/chat/ here at the reverse proxy. Slow LLM calls then cannot consume the
  # normal API's threads. All other routes should continue to api:8000.
  chat-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the Supabase pooler DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - type: bind
        source: ./firebase-service-account.json
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      redis: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    command: >-
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 -k gthread
      --workers 2 --threads 15 --timeout 60 --max-requests 2000 --max-requests-jitter 200
    ports: !override ["127.0.0.1:8002:8000"]
    # The same probe as `api` — see the note there for why the port is 8000 and where the Host
    # header comes from. 8002 is the host side of the mapping on the line above; inside this
    # container gunicorn is on 8000 like every other one.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as request; host = os.getenv('DJANGO_ALLOWED_HOSTS', 'localhost').split(',')[0]; request.urlopen(request.Request('http://127.0.0.1:8000/healthz', headers={'Host': host}), timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Permanent compatibility lane for old multipart POST /scans/. Route only that exact method
  # and path here; two threads cap memory pressure while new clients upload directly to Storage.
  legacy-upload-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the Supabase pooler DATABASE_URL in .env}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - type: bind
        source: ./firebase-service-account.json
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      redis: {condition: service_healthy}
      redis-cache: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    command: >-
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 -k gthread
      --workers 1 --threads 2 --timeout 120 --max-requests 500 --max-requests-jitter 50
    ports: !override ["127.0.0.1:8003:8000"]
    # As above. This one matters most of the three: with 1 worker x 2 threads, two stuck uploads
    # are the entire capacity of this container, and nothing about that is visible from outside.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as request; host = os.getenv('DJANGO_ALLOWED_HOSTS', 'localhost').split(',')[0]; request.urlopen(request.Request('http://127.0.0.1:8000/healthz', headers={'Host': host}), timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  doodee_redis:
